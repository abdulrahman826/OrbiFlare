# Render Blueprint: the FastAPI backend. (The Next.js frontend is deployed on Vercel, see DEPLOY.md.)
services:
  - type: web
    name: orbiflare-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: starter            # the pipeline needs more than the 512 MB of the free plan
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ORBIFLARE_MODE
        value: real
      - key: FIRMS_AUTO_SYNC
        value: "true"
      - key: FIRMS_MANUAL_REFRESH
        value: "false"       # public API: do not let visitors spend the NASA quota
      - key: FIRMS_MAP_KEY
        sync: false          # set in the Render dashboard (a NEW, rotated key)
      - key: CORS_ORIGINS
        sync: false          # your Vercel URL, e.g. https://orbiflare.vercel.app
      - key: DATABASE_URL
        sync: false          # set in the Render dashboard -- external Postgres (e.g. Neon) so data survives restarts;
                              # Render's free/starter plans have no persistent disk, so local SQLite is wiped on every
                              # restart otherwise. MUST start with postgresql+psycopg2:// (not bare postgresql://) --
                              # SQLAlchemy 2.1 defaults an unqualified scheme to the psycopg3 driver, which isn't
                              # installed (backend/requirements.txt has psycopg2-binary)
