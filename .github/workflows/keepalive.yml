# Pings the Render API so the free plan does not spin it down after ~15 minutes idle.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 https://orbiflare-api.onrender.com/api/health > /dev/null
